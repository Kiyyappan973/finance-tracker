{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">
                🤖 Smart Transaction Analyzer
            </h2>

            <p class="text-muted mb-0">
                Upload your Bank Statement and let AI organize your finances.
            </p>

        </div>

        <span class="badge bg-primary fs-6 px-3 py-2">
            AI Powered
        </span>

    </div>

    <!-- Upload Card -->

    <div class="card border-0 shadow-lg rounded-4">

        <div class="card-body text-center py-5">

            <img
                src="https://cdn-icons-png.flaticon.com/512/2889/2889676.png"
                width="120"
                class="mb-4">

            <h3 class="fw-bold">
                Upload Bank Statement
            </h3>

            <p class="text-muted">

                PDF • CSV • Excel

            </p>

            <form
                action="/analyze_statement"
                method="POST"
                enctype="multipart/form-data">
                <div class="opening-balance-box">

    <label for="opening_balance">
        Opening Balance ₹
    </label>

    <input
        type="number"
        id="opening_balance"
        name="opening_balance"
        step="0.01"
        placeholder="Example: 10000"
        required
    >

</div>
<div class="mb-4 text-start">

    <label for="statement_password" class="form-label fw-bold">
        🔐 Statement Password
    </label>

    <input
        type="password"
        id="statement_password"
        name="statement_password"
        class="form-control form-control-lg"
        placeholder="Enter PDF statement password"
        autocomplete="off"
    >

    <small class="text-muted">
        Leave empty if your statement is not password protected.
    </small>

</div>

                <input

                    type="file"

                    class="form-control form-control-lg mb-4"

                    name="statement"

                    accept=".pdf,.csv,.xlsx"

                    required>

                <button
                    class="btn btn-primary btn-lg rounded-pill px-5">

                    🚀 Upload & Analyze

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
