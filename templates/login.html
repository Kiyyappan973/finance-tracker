{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block extra_css %}
<style>
.login-card{
    max-width:480px;
    margin:auto;
    margin-top:60px;
    border-radius:22px;
}

.logo{
    font-size:60px;
}

.form-control{
    border-radius:12px;
    height:50px;
}

.btn-login{
    background:#00C896;
    color:white;
    border:none;
    border-radius:12px;
    height:50px;
    font-weight:600;
}

.btn-login:hover{
    background:#00B386;
    color:white;
}

.small-link{
    text-decoration:none;
}

.small-link:hover{
    text-decoration:underline;
}
</style>
{% endblock %}

{% block content %}

<div class="card login-card shadow">

<div class="card-body p-5">

<div class="text-center mb-4">

<div class="logo">
💰
</div>

<h2 class="fw-bold">
Welcome Back
</h2>

<p class="text-muted">
Login to continue managing your finances.
</p>

</div>

{% if error %}

<div class="alert alert-danger">
{{ error }}
</div>

{% endif %}

<form action="/login" method="POST">

<div class="mb-3">

<label class="form-label">
Username / Email / Mobile
</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter Username, Email or Mobile"
required>

</div>

<div class="mb-4">

<label class="form-label">
Password
</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter Password"
required>

</div>

<button
type="submit"
class="btn btn-login w-100">

Login

</button>

</form>

<div class="text-center mt-4">

<a href="/forgot_password"
class="small-link">

Forgot Password?

</a>

</div>

<hr>

<div class="text-center">

Don't have an account?

<a href="/signup"
class="small-link fw-bold">

Create Account

</a>

</div>

</div>

</div>

{% endblock %}
