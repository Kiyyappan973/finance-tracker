{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">

                    <h2 class="fw-bold mb-4">
                        <i class="bi bi-lock-fill text-danger"></i>
                        Change Password
                    </h2>

                    <form method="POST" action="/change_password">

                        <div class="mb-3">

                            <label class="form-label">
                                Current Password
                            </label>

                            <input type="password"
       class="form-control"
       name="current_password"
       required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                New Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   name="new_password"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   name="confirm_password"
                                   required>

                        </div>

                        <button class="btn btn-danger w-100">

                            <i class="bi bi-shield-lock"></i>

                            Update Password

                        </button>   

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
