{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <h2 class="fw-bold mb-4">
                        <i class="bi bi-pencil-square text-primary"></i>
                        Edit Profile
                    </h2>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="fullname"
                                class="form-control"
                                value="{{ user.fullname }}"
                                required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ user.email }}"
                                required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Mobile Number
                            </label>

                            <input
                                type="text"
                                name="mobile"
                                class="form-control"
                                value="{{ user.mobile }}"
                                required>

                        </div>

                        <div class="d-flex gap-3">

                            <button
                                type="submit"
                                class="btn btn-success">

                                <i class="bi bi-check-circle"></i>

                                Save Changes

                            </button>

                            <a href="/profile"
                               class="btn btn-secondary">

                                Cancel

                            </a>

                        </div>

                    </form>
                   

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
