<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Finance Tracker{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
/* ===========================
   SIDEBAR
=========================== */

.sidebar{

position:fixed;
left:0;
top:0;

width:260px;
height:100vh;

background:#ffffff;

box-shadow:0 0 25px rgba(0,0,0,.08);

padding:25px;

z-index:1000;

transition:.35s;

overflow-y:auto;

}

.sidebar-header{

margin-bottom:35px;

}

.sidebar-header h2{

font-size:30px;
font-weight:800;
color:#2563eb;

}

.sidebar ul{

list-style:none;
padding:0;
margin:0;

}

.sidebar ul li{

margin-bottom:10px;

}

.sidebar ul li a{

display:flex;
align-items:center;

gap:12px;

padding:14px 18px;

border-radius:14px;

text-decoration:none;

font-weight:600;

color:#475569;

transition:.25s;

}

.sidebar ul li a:hover{

background:#2563eb;
color:white;

}

.sidebar-bottom{

position:absolute;

bottom:25px;

left:25px;

right:25px;

}

.sidebar-bottom a{

display:flex;

align-items:center;

gap:10px;

padding:14px;

border-radius:14px;

background:#ef4444;

color:white;

text-decoration:none;

font-weight:600;

}

.main-content{

margin-left:260px;

padding:35px;

min-height:100vh;

background:#f5f7fb;

transition:.35s;

}

.sidebar-overlay{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.45);

z-index:999;

}
/* ===========================
   MOBILE RESPONSIVE
=========================== */

@media (max-width:991px){

    .sidebar{

        left:-280px;

        width:260px;

    }

    .sidebar.show{

        left:0;

    }

    .main-content{

        margin-left:0;

        padding:20px;

    }

    .sidebar-overlay.show{

        display:block;

    }

}

@media (min-width:992px){

    #menuBtn{

        display:none;

    }

}
    </style>

    {% block extra_css %}{% endblock %}

</head>

<body>

<body>

<!-- Mobile Navbar -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm d-lg-none sticky-top">

    <div class="container-fluid">

        <button class="btn btn-light"
                id="menuBtn">

            <i class="bi bi-list fs-3"></i>

        </button>

        <a class="navbar-brand fw-bold text-primary ms-2"
           href="/dashboard">

            💰 Finance Tracker

        </a>

    </div>

</nav>


<!-- Sidebar -->

<div class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <h2>
            💰 Finance Tracker
        </h2>

    </div>

    <ul>

        <li>
            <a href="/dashboard">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>
        </li>

        <li>
            <a href="/income">
                <i class="bi bi-cash-stack"></i>
                Income
            </a>
        </li>

        <li>
            <a href="/expenses">
                <i class="bi bi-wallet2"></i>
                Expenses
            </a>
        </li>

        <li>
            <a href="/insurance">
                <i class="bi bi-shield-check"></i>
                Insurance
            </a>
        </li>

        <li>
            <a href="/goal_planner">
                <i class="bi bi-bullseye"></i>
                Goals
            </a>
        </li>

        <li>
            <a href="/reports">
                <i class="bi bi-bar-chart"></i>
                Reports
            </a>
        </li>

        <li>
            <a href="/profile">
                <i class="bi bi-person-circle"></i>
                Profile
            </a>
        </li>

    </ul>

    <div class="sidebar-bottom">

        <a href="/logout">

            <i class="bi bi-box-arrow-right"></i>

            Logout

        </a>

    </div>

</div>


<!-- Overlay -->

<div class="sidebar-overlay"
     id="overlay"></div>


<!-- Main Content -->

<div class="main-content">

    {% block content %}
    {% endblock %}

</div>
<script>

const menuBtn = document.getElementById("menuBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

if(menuBtn){

    menuBtn.addEventListener("click",()=>{

        sidebar.classList.toggle("show");
        overlay.classList.toggle("show");

    });

}

overlay.addEventListener("click",()=>{

    sidebar.classList.remove("show");
    overlay.classList.remove("show");

});

</script>

</body>

</html>
