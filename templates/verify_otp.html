{% extends "base.html" %}

{% block title %}
Verify OTP
{% endblock %}

{% block extra_css %}
<style>
.otp-card{
    max-width:500px;
    margin:auto;
    margin-top:60px;
}

.otp-input{
    height:55px;
    font-size:24px;
    text-align:center;
    border-radius:12px;
}
</style>
{% endblock %}

{% block content %}

<div class="card otp-card shadow">

<div class="card-body p-5">

<div class="text-center mb-4">

<h1>📧</h1>

<h2 class="fw-bold">
Verify Email
</h2>

<p class="text-muted">
Enter the OTP sent to your email.
</p>

</div>

{% if error %}

<div class="alert alert-danger">
{{ error }}
</div>

{% endif %}

<form action="/verify_otp" method="POST">

<div class="mb-4">

<input
type="text"
name="otp"
maxlength="6"
class="form-control otp-input"
placeholder="Enter 6-digit OTP"
required>

</div>

<button
class="btn btn-success w-100">

Verify OTP

</button>

</form>

<div class="text-center mt-4">

Didn't receive the code?

<br><br>

<button
class="btn btn-outline-success"
disabled>

Resend OTP
(Coming Soon)

</button>

</div>

</div>

</div>

{% endblock %}
