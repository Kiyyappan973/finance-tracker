{% extends "base.html" %}

{% block title %}
Budget Planner
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card shadow-lg p-4">

            <h2 class="mb-4 text-center">
                💳 Monthly Budget Planner
            </h2>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Month
                    </label>

                    <select name="month" class="form-select" required>

                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Budget Amount (₹)
                    </label>

                    <input
                        type="number"
                        name="budget"
                        class="form-control"
                        placeholder="Enter Monthly Budget"
                        required>

                </div>

                <button class="btn btn-primary w-100">

                    💾 Save Budget

                </button>

            </form>

        </div>

    </div>

</div>

<br>

<div class="card shadow-lg">

    <div class="card-body">

        <h3 class="mb-4">
            📋 Saved Budgets
        </h3>

        <table class="table table-hover">

            <thead class="table-dark">

                <tr>

                    <th>Month</th>
                    <th>Budget</th>

                </tr>

            </thead>

            <tbody>

                {% for item in budgets %}

                <tr>

                    <td>{{ item.month }}</td>

                    <td>
                        ₹{{ item.budget }}
                    </td>

                </tr>

                {% else %}

                <tr>

                    <td colspan="2" class="text-center">

                        No Budget Added

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
